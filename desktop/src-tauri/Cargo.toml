[package]
name = "berkshire-nexus-desktop"
version = "1.2.0"
description = "Auditable desktop operations console for BerkshireNexus"
authors = ["BerkshireNexus contributors"]
edition = "2021"

[lib]
name = "berkshire_nexus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
