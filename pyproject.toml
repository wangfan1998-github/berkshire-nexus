[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "berkshire-nexus"
version = "1.2.0"
description = "Auditable research, adaptive learning, paper trading, and risk-gated Binance Stocks integration"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "OpenSource Contributor" }
]
dependencies = []

[project.scripts]
berkshire-nexus = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
