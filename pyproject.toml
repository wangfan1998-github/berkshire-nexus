[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omni-alpha-agent"
version = "1.0.0"
description = "Multi-Agent & Quantitative Investment Research Framework combining Berkshire Value, Serenity Supply-Chain Bottlenecks, and Qlib Alpha Factors"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "OpenSource Contributor" }
]
dependencies = [
    "requests>=2.28.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "tabulate>=0.9.0"
]

[project.scripts]
omni-alpha = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
